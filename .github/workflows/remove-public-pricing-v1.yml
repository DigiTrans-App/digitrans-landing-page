name: Remove public pricing from DigiTrust launch site

on:
  push:
    branches:
      - launch/private-pricing-and-aws-branding-v1
    paths:
      - .github/workflows/remove-public-pricing-v1.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Remove public pricing and keep commercial terms in controlled channels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f'REQUIRED_ANCHOR_NOT_FOUND::{path}::{old[:120]}')
              write(path, text.replace(old, new))

          # Homepage: remove structured price data and replace public amounts with a controlled-channel message.
          text = read('index.html')
          text, count = re.subn(
              r'"areaServed": "US",\s*"offers": \{\s*"@type": "AggregateOffer",\s*"priceCurrency": "USD",\s*"lowPrice": "25000",\s*"highPrice": "50000",\s*"offerCount": "1"\s*\}',
              '"areaServed": "US"',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'HOMEPAGE_SCHEMA_PRICE_BLOCK_COUNT::{count}')
          text = text.replace(
              '<div class="fact-card"><span>Investment</span><strong>$25,000–$50,000</strong></div>',
              '<div class="fact-card"><span>Commercial terms</span><strong>Provided through AWS and direct sales channels</strong></div>',
          )
          text = text.replace(
              '<div class="fact-card"><span>Expansion</span><strong>$100,000+ annual production path</strong></div>',
              '<div class="fact-card"><span>Expansion</span><strong>Customer-specific production path</strong></div>',
          )
          write('index.html', text)

          # Financial-services page: remove structured price data and public commercial amounts.
          text = read('financial-services/index.html')
          text, count = re.subn(
              r',"offers":\{"@type":"AggregateOffer","priceCurrency":"USD","lowPrice":"25000","highPrice":"50000"\}',
              '',
              text,
          )
          if count != 1:
              raise SystemExit(f'FINANCIAL_SCHEMA_PRICE_BLOCK_COUNT::{count}')
          text = text.replace('<span class="credibility-pill">$25,000–$50,000</span>', '<span class="credibility-pill">Commercial terms through controlled sales channels</span>')
          text = text.replace('<div class="fact-card"><span>Investment</span><strong>$25,000–$50,000</strong></div>', '<div class="fact-card"><span>Commercial terms</span><strong>Customer-specific</strong></div>')
          text = text.replace('<div class="fact-card"><span>Expansion</span><strong>$100,000+ annual production path</strong></div>', '<div class="fact-card"><span>Expansion</span><strong>Production pathway</strong></div>')
          write('financial-services/index.html', text)

          # Healthcare page: remove structured price data and public commercial amounts.
          text = read('healthcare/index.html')
          text, count = re.subn(
              r',"offers":\{"@type":"AggregateOffer","priceCurrency":"USD","lowPrice":"25000","highPrice":"50000"\}',
              '',
              text,
          )
          if count != 1:
              raise SystemExit(f'HEALTHCARE_SCHEMA_PRICE_BLOCK_COUNT::{count}')
          text = text.replace('<span class="credibility-pill">$25,000–$50,000</span>', '<span class="credibility-pill">Commercial terms through controlled sales channels</span>')
          text = text.replace('<div class="fact-card"><span>Investment</span><strong>$25,000–$50,000</strong></div>', '<div class="fact-card"><span>Commercial terms</span><strong>Customer-specific</strong></div>')
          text = text.replace('<div class="fact-card"><span>Expansion</span><strong>$100,000+ annual production path</strong></div>', '<div class="fact-card"><span>Expansion</span><strong>Production pathway</strong></div>')
          write('healthcare/index.html', text)

          # Marketplace page: direct buyers to the listing without duplicating pricing on the public website.
          text = read('aws-marketplace/index.html')
          text = text.replace('<div class="fact-card"><span>Investment</span><strong>$25,000–$50,000</strong></div>', '<div class="fact-card"><span>Commercial terms</span><strong>Review in AWS Marketplace or with DigiTrans</strong></div>')
          text = text.replace('<div class="fact-card"><span>Expansion</span><strong>$100,000+ annual production path</strong></div>', '<div class="fact-card"><span>Expansion</span><strong>Customer-specific production path</strong></div>')
          write('aws-marketplace/index.html', text)

          # Intake: remove the public budget bands while retaining a useful commercial-readiness signal.
          text = read('get-started.html')
          text = text.replace(
              '<p><strong>30–45 days · 2–3 AI workflows · $25,000–$50,000 · AWS Marketplace available</strong></p>',
              '<p><strong>30–45 days · 2–3 AI workflows · AWS Marketplace available</strong></p>',
          )
          budget_pattern = re.compile(
              r'<div class="field"><label for="budget">Expected pilot budget</label><select id="budget" name="Expected Pilot Budget">.*?</select></div>',
              re.S,
          )
          replacement = (
              '<div class="field"><label for="commercial_readiness">Commercial readiness</label>'
              '<select id="commercial_readiness" name="Commercial Readiness">'
              '<option value="" selected>Still exploring</option>'
              '<option>Budget owner identified</option>'
              '<option>Internal approval in progress</option>'
              '<option>Ready to review purchase options</option>'
              '</select></div>'
          )
          text, count = budget_pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'INTAKE_BUDGET_FIELD_COUNT::{count}')
          write('get-started.html', text)

          # Replace the former public pricing catalogue with a no-price engagement guide.
          pricing = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>DigiTrust Enterprise Engagements | DigiTrans</title>
            <meta name="description" content="Review DigiTrust enterprise pilot, production expansion, evaluation, and AWS Marketplace purchasing paths. Commercial terms are provided through controlled sales channels." />
            <link rel="canonical" href="https://www.digitranshq.com/pricing/" />
            <meta property="og:type" content="website" />
            <meta property="og:site_name" content="DigiTrans" />
            <meta property="og:title" content="DigiTrust Enterprise Engagements" />
            <meta property="og:description" content="Choose the right DigiTrust engagement and confirm commercial terms through AWS Marketplace or a customer-specific sales process." />
            <meta property="og:url" content="https://www.digitranshq.com/pricing/" />
            <meta property="og:image" content="https://www.digitranshq.com/assets/digitrust-aws-marketplace-logo-640.png" />
            <meta name="twitter:card" content="summary_large_image" />
            <link rel="icon" href="/digitrans-logo.png" />
            <link rel="stylesheet" href="/assets/site.css" />
            <link rel="stylesheet" href="/assets/category-launch.css" />
          </head>
          <body class="launch-body">
            <a class="skip-link" href="#main">Skip to main content</a>
            <div class="launch-bar" role="status"><div class="launch-bar-inner"><strong>DigiTrust is available through AWS Marketplace</strong><a href="https://aws.amazon.com/marketplace/pp/prodview-ipxmlnusygyb4" target="_blank" rel="noopener">View purchase options</a></div></div>
            <nav class="nav launch-nav" aria-label="Primary navigation">
              <a class="brand" href="/" aria-label="DigiTrans DigiTrust home"><img src="/digitrans-logo.png" alt="DigiTrans logo" width="148" height="43" /><span class="brand-name">DigiTrust</span></a>
              <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-menu" data-nav-toggle>Menu</button>
              <div class="nav-menu" id="primary-menu"><div class="navlinks"><a href="/">Home</a><a href="#enterprise">Pilot</a><a href="#evaluation">Other options</a><a href="/aws-marketplace/" data-campaign-link>Buy on AWS</a><a href="/reference-architecture/" data-campaign-link>How it works</a></div><div class="nav-cta"><a class="btn primary" href="/get-started.html?intent=engagement-guidance" data-campaign-link>Request guidance</a></div></div>
            </nav>
            <main id="main">
              <section class="page-hero" aria-labelledby="page-title"><div class="page-hero-inner">
                <div class="launch-kicker">Enterprise Engagements</div>
                <h1 id="page-title">Choose the right engagement. Confirm commercial terms through controlled channels.</h1>
                <p class="lead"><strong>The recommended enterprise starting point is a focused DigiTrust Enterprise AI Evidence and Assurance Pilot across two to three consequential AI workflows.</strong></p>
                <p class="sublead">Pricing, discounts, custom offers, and transaction terms are provided through AWS Marketplace, AWS Partner and co-selling processes, or a customer-specific DigiTrans proposal.</p>
                <div class="hero-actions"><a class="btn primary" href="/get-started.html?intent=enterprise-pilot" data-campaign-link>Request a pilot briefing</a><a class="btn marketplace" href="https://aws.amazon.com/marketplace/pp/prodview-ipxmlnusygyb4" target="_blank" rel="noopener">View on AWS Marketplace</a></div>
              </div></section>

              <section class="editorial-section" id="enterprise" aria-labelledby="enterprise-title"><div class="editorial-wrap">
                <div class="section-label">Recommended enterprise starting point</div>
                <h2 class="display-heading" id="enterprise-title">DigiTrust Enterprise AI Evidence and Assurance Pilot</h2>
                <div class="pilot-panel"><div>
                  <h3>Make two to three consequential AI workflows reviewable.</h3>
                  <p>Assess current controls, map evidence and approval requirements, identify known limitations, and define a production roadmap for regulated enterprise use.</p>
                  <div class="pilot-facts"><div class="fact-card"><span>Duration</span><strong>30–45 days</strong></div><div class="fact-card"><span>Scope</span><strong>2–3 workflows</strong></div><div class="fact-card"><span>Commercial terms</span><strong>Customer-specific</strong></div><div class="fact-card"><span>Purchasing</span><strong>AWS Marketplace available</strong></div></div>
                  <div class="hero-actions"><a class="btn primary" href="/get-started.html?intent=enterprise-pilot" data-campaign-link>Scope the pilot</a><a class="btn marketplace" href="https://aws.amazon.com/marketplace/pp/prodview-ipxmlnusygyb4" target="_blank" rel="noopener">Review purchase options</a></div>
                </div><ol class="pilot-deliverables"><li><span>1</span><div><strong>Workflow and control assessment</strong><br />Current evidence, checks, governance, approval, and operating boundaries.</div></li><li><span>2</span><div><strong>Evidence and assurance map</strong><br />Sources, checks, decisions, approved-use conditions, exceptions, and limitations.</div></li><li><span>3</span><div><strong>Production roadmap</strong><br />Implementation design, operating model, data handling, success criteria, and expansion.</div></li><li><span>4</span><div><strong>Executive findings</strong><br />Customer-safe material for leadership, security, risk, compliance, purchasing, and partners.</div></li></ol></div>
              </div></section>

              <section class="editorial-section soft" id="evaluation" aria-labelledby="evaluation-title"><div class="editorial-wrap">
                <div class="section-label">Other ways to engage</div>
                <h2 class="display-heading" id="evaluation-title">Start with the smallest engagement that resolves a real decision.</h2>
                <p class="intro-copy">DigiTrans can recommend an enterprise pilot, a focused Evidence Packet QuickStart, a guided evaluation, or a production-expansion engagement without publishing commercial details on the public website.</p>
                <div class="use-case-grid">
                  <article class="use-case-card"><span>ENTERPRISE PILOT</span><h3>Evidence and Assurance Pilot</h3><p>A cross-functional review of two to three important AI workflows, with executive findings and a production roadmap.</p><a class="btn secondary" href="/get-started.html?intent=enterprise-pilot" data-campaign-link>Request a pilot briefing</a></article>
                  <article class="use-case-card"><span>FOCUSED EVALUATION</span><h3>Evidence Packet QuickStart</h3><p>A bounded starting point for one workflow, one evidence path, and one customer-safe assurance output.</p><a class="btn secondary" href="/get-started.html?intent=quickstart" data-campaign-link>Discuss the QuickStart</a></article>
                  <article class="use-case-card"><span>PRODUCTION</span><h3>Enterprise expansion</h3><p>A customer-specific production engagement based on validated workflows, integrations, security requirements, support, and operating responsibilities.</p><a class="btn secondary" href="/get-started.html?intent=production-expansion" data-campaign-link>Discuss production expansion</a></article>
                  <article class="use-case-card"><span>AWS MARKETPLACE</span><h3>Marketplace purchasing</h3><p>Review the active listing and work with DigiTrans and the appropriate AWS teams on customer-specific purchase options.</p><a class="btn secondary" href="/aws-marketplace/" data-campaign-link>Review the buying path</a></article>
                </div>
                <div class="notice trust-notice mt"><p><strong>Commercial boundary:</strong> Pricing, discounts, custom offer structures, and transaction-specific terms are provided only through AWS Marketplace, AWS Partner and co-selling activities, or a direct customer proposal from DigiTrans.</p></div>
              </div></section>

              <section class="launch-cta" aria-labelledby="cta-title"><div class="editorial-narrow"><div class="section-label" style="color:#8dbdff">Choose the next action</div><h2 id="cta-title">Request guidance before selecting an engagement.</h2><p>DigiTrans will help identify the right workflow, engagement type, AWS purchasing path, and next decision without requiring sensitive information in the first conversation.</p><div class="hero-actions"><a class="btn primary" href="/get-started.html?intent=engagement-guidance" data-campaign-link>Request guidance</a><a class="btn marketplace" href="https://aws.amazon.com/marketplace/pp/prodview-ipxmlnusygyb4" target="_blank" rel="noopener">View on AWS Marketplace</a></div></div></section>
            </main>
            <footer class="footer"><div class="footer-wrap"><div class="footer-brand"><img src="/digitrans-logo.png" alt="DigiTrans logo" width="156" height="45" /><div><strong>DigiTrust</strong><br />Enterprise AI Evidence and Assurance</div></div><div class="footer-copy category-footer-note">Commercial terms are provided through controlled AWS and direct sales channels.<div class="footer-links"><a href="/">Home</a><a href="/aws-marketplace/" data-campaign-link>Buy on AWS</a><a href="/get-started.html" data-campaign-link>Get started</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="mailto:info@digitranshq.com">Contact</a></div><div style="margin-top:10px">© <span data-current-year>2026</span> DigiTrans LLC.</div></div></div></footer>
            <script src="/assets/site.js" defer></script>
          </body>
          </html>
          '''
          write('pricing/index.html', '\n'.join(line[10:] if line.startswith('          ') else line for line in pricing.splitlines()).strip() + '\n')

          # Public commercial detail must remain outside the website source.
          prohibited_patterns = {
              'currency amount': re.compile(r'\$\s*\d'),
              'structured price': re.compile(r'"(?:lowPrice|highPrice|priceCurrency)"'),
              'direct Stripe checkout': re.compile(r'buy\.stripe\.com', re.I),
          }
          failures = []
          for page in Path('.').rglob('*.html'):
              content = page.read_text(encoding='utf-8')
              for label, pattern in prohibited_patterns.items():
                  if pattern.search(content):
                      failures.append(f'{label} remains in {page}')
          if failures:
              raise SystemExit('PUBLIC_PRICING_REMOVAL_INCOMPLETE\n' + '\n'.join(failures))

          print('PUBLIC_PRICING_REMOVAL: PASS')
          PY
      - name: Commit public-site revision
        run: |
          git config user.name 'DigiTrans Research & Engineering'
          git config user.email 'johnagj@outlook.com'
          git add index.html financial-services/index.html healthcare/index.html aws-marketplace/index.html get-started.html pricing/index.html
          git commit -m 'Move pricing details to controlled AWS and sales channels'
          git push origin HEAD:launch/private-pricing-and-aws-branding-v1
