name: Validate DigiTrust category-launch site

on:
  push:
    branches:
      - main
      - launch/category-launch-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate HTML, claims, links, and launch contract
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import json
          import sys

          root = Path('.')
          expected_pages = [
              Path('index.html'),
              Path('get-started.html'),
              Path('pricing/index.html'),
              Path('financial-services/index.html'),
              Path('healthcare/index.html'),
              Path('aws-marketplace/index.html'),
              Path('reference-architecture/index.html'),
              Path('intake-thank-you/index.html'),
          ]
          marketplace = 'https://aws.amazon.com/marketplace/pp/prodview-ipxmlnusygyb4'

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = ''
                  self.h1_count = 0
                  self.canonical = []
                  self.links = []
                  self.ids = set()
                  self.in_intake = False
                  self.intake_fields = set()
                  self.required_intake_fields = set()

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'title':
                      self.in_title = True
                  if tag == 'h1':
                      self.h1_count += 1
                  if tag == 'form' and data.get('id') == 'digitrust-intake':
                      self.in_intake = True
                  if self.in_intake and tag in {'input', 'select', 'textarea'}:
                      field_id = data.get('id')
                      if field_id and data.get('type') != 'hidden' and field_id != 'website_check':
                          self.intake_fields.add(field_id)
                          if 'required' in data:
                              self.required_intake_fields.add(field_id)
                  if data.get('id'):
                      self.ids.add(data['id'])
                  if tag == 'link' and data.get('rel') == 'canonical' and data.get('href'):
                      self.canonical.append(data['href'])
                  if tag in {'a', 'img', 'script', 'link'}:
                      value = data.get('href') or data.get('src')
                      if value:
                          self.links.append(value)

              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False
                  if tag == 'form':
                      self.in_intake = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

          def resolve_local(link: str):
              parsed = urlsplit(link)
              if parsed.scheme or parsed.netloc or link.startswith(('mailto:', 'tel:', 'javascript:')):
                  return None
              path = parsed.path
              if not path or path == '/':
                  return Path('index.html')
              if path.startswith('/'):
                  path = path[1:]
              candidate = Path(path)
              if path.endswith('/'):
                  candidate = candidate / 'index.html'
              elif not candidate.suffix:
                  directory_index = candidate / 'index.html'
                  html_file = candidate.with_suffix('.html')
                  if (root / directory_index).exists():
                      candidate = directory_index
                  elif (root / html_file).exists():
                      candidate = html_file
              return candidate

          failures = []
          for page in expected_pages:
              if not page.is_file():
                  failures.append(f'missing expected page: {page}')
                  continue
              text = page.read_text(encoding='utf-8')
              parser = PageParser()
              parser.feed(text)
              if not parser.title.strip():
                  failures.append(f'missing title: {page}')
              if parser.h1_count != 1:
                  failures.append(f'expected one h1, found {parser.h1_count}: {page}')
              if len(parser.canonical) != 1 and page.name != 'index.html' and 'intake-thank-you' not in str(page):
                  failures.append(f'expected one canonical URL: {page}')
              for link in parser.links:
                  target = resolve_local(link)
                  if target is None:
                      continue
                  if not (root / target).exists():
                      failures.append(f'broken local reference from {page}: {link} -> {target}')

          homepage = Path('index.html').read_text(encoding='utf-8')
          marketplace_page = Path('aws-marketplace/index.html').read_text(encoding='utf-8')
          if 'Prove the AI decision—and who authorized its use.' not in homepage:
              failures.append('homepage category headline is missing')
          if 'Explore the Trust Record' not in homepage or 'Book a 30-minute briefing' not in homepage:
              failures.append('homepage proof and briefing CTA hierarchy is missing')
          if 'pilot-summary' not in homepage or '30–45 days' not in homepage or '2–3 AI workflows' not in homepage:
              failures.append('homepage pilot summary is missing')
          if 'DigiTrust Enterprise AI Evidence and Assurance Pilot' not in homepage:
              failures.append('homepage enterprise pilot is missing')
          if marketplace not in homepage or marketplace not in marketplace_page:
              failures.append('live AWS Marketplace URL is missing from launch pages')

          stale_phrases = [
              'listing publication pending',
              'Marketplace publication remains pending',
              'currently public listing',
              'final result and listing publication pending',
          ]
          launch_pages = [
              Path('index.html'),
              Path('get-started.html'),
              Path('pricing/index.html'),
              Path('financial-services/index.html'),
              Path('healthcare/index.html'),
              Path('aws-marketplace/index.html'),
              Path('reference-architecture/index.html'),
          ]
          for page in launch_pages:
              text = page.read_text(encoding='utf-8')
              if '/get-started.html' in text:
                  failures.append(f'noncanonical get-started URL in {page}')
              for phrase in stale_phrases:
                  if phrase.lower() in text.lower():
                      failures.append(f'stale Marketplace phrase in {page}: {phrase}')

          prohibited_named_accounts = [
              'Mutual of Omaha', 'FNBO', 'Regions Bank', 'Nebraska Medicine',
              'Froedtert', 'ThedaCare', 'King & Spalding',
          ]
          vertical_text = (
              Path('financial-services/index.html').read_text(encoding='utf-8') +
              Path('healthcare/index.html').read_text(encoding='utf-8')
          )
          for name in prohibited_named_accounts:
              if name.lower() in vertical_text.lower():
                  failures.append(f'unconfirmed target account appears in public vertical page: {name}')

          js = Path('assets/site.js').read_text(encoding='utf-8')
          if 'data-nav-toggle' not in js or 'setupCampaignAttribution' not in js:
              failures.append('shared site JavaScript is missing navigation or attribution support')

          analytics_js = Path('assets/analytics.js').read_text(encoding='utf-8')
          required_events = {
              'trust_record_clicked', 'briefing_cta_clicked', 'intake_started', 'lead_submitted',
          }
          for event in required_events:
              if event not in analytics_js:
                  failures.append(f'conversion measurement is missing event: {event}')
          for forbidden_value in ['full_name', 'business_goal', 'document.cookie', 'navigator.userAgent']:
              if forbidden_value in analytics_js:
                  failures.append(f'conversion measurement references prohibited data: {forbidden_value}')
          if 'data-analytics-event="trust_record_clicked"' not in homepage:
              failures.append('homepage Trust Record CTA is missing its measurement hook')

          endpoint = Path('functions/api/events.js').read_text(encoding='utf-8')
          if 'CONVERSION_EVENTS' not in endpoint or 'requestHasSameOrigin' not in endpoint:
              failures.append('conversion endpoint is missing storage or same-origin controls')

          intake = PageParser()
          intake.feed(Path('get-started.html').read_text(encoding='utf-8'))
          expected_intake_fields = {
              'full_name', 'email', 'company', 'role', 'workflow_type', 'business_goal', 'consent',
          }
          expected_required_fields = {'full_name', 'email', 'company', 'workflow_type', 'consent'}
          if intake.intake_fields != expected_intake_fields:
              failures.append(
                  f'intake field contract changed: expected {sorted(expected_intake_fields)}, '
                  f'found {sorted(intake.intake_fields)}'
              )
          if intake.required_intake_fields != expected_required_fields:
              failures.append(
                  f'intake required-field contract changed: expected {sorted(expected_required_fields)}, '
                  f'found {sorted(intake.required_intake_fields)}'
              )
          if intake.canonical != ['https://www.digitranshq.com/get-started']:
              failures.append('get-started canonical URL must be extensionless')

          cloudflare_headers = Path('_headers').read_text(encoding='utf-8')
          for header in [
              'Strict-Transport-Security', 'X-Content-Type-Options', 'X-Frame-Options',
              'Referrer-Policy', 'Permissions-Policy',
          ]:
              if header not in cloudflare_headers:
                  failures.append(f'missing Cloudflare security header: {header}')

          vercel_config = json.load(open('vercel.json', encoding='utf-8'))
          if vercel_config.get('cleanUrls') is not True:
              failures.append('compatibility configuration does not use extensionless canonical URLs')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          if 'https://www.digitranshq.com/get-started</loc>' not in sitemap:
              failures.append('sitemap is missing the extensionless get-started URL')
          if 'https://www.digitranshq.com/get-started.html</loc>' in sitemap:
              failures.append('sitemap contains the redirected get-started URL')

          if failures:
              print('\n'.join('FAIL: ' + item for item in failures))
              sys.exit(1)

          print('HTML_CONTRACT_VALIDATION: PASS')
          print(f'Validated pages: {len(expected_pages)}')
          print('MARKETPLACE_STATUS: LIVE')
          print('CONVERSION_PATH_CONTRACT: PASS')
          print('CLOUDFLARE_DEPLOYMENT_CONTRACT: PASS')
          print('TARGET_ACCOUNT_PUBLICATION_GUARD: PASS')
          PY
      - name: Validate JavaScript and conversion measurement
        run: |
          node --check assets/site.js
          node --check assets/analytics.js
          node --check functions/api/events.js
          node --test tests/*.test.js
      - name: Serve and smoke-test the static site
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/digitrust-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          for path in / /get-started.html /pricing/ /financial-services/ /healthcare/ /aws-marketplace/ /reference-architecture/; do
            curl --fail --silent --show-error "http://127.0.0.1:8000${path}" >/dev/null
          done
          echo 'STATIC_SITE_SMOKE_TEST: PASS'
      - name: Record validation summary
        run: |
          {
            echo '## DigiTrust category-launch validation'
            echo
            echo '- HTML and canonical structure: pass'
            echo '- Internal references: pass'
            echo '- Marketplace-live claim guard: pass'
            echo '- Conversion path and intake field contract: pass'
            echo '- Cloudflare Pages header and canonical URL contract: pass'
            echo '- Public target-account guard: pass'
            echo '- JavaScript syntax and conversion regression tests: pass'
            echo '- Local static smoke test: pass'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-analytics-report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate protected credential storage and fixed analytics query
        shell: powershell
        run: .\scripts\check-analytics.ps1 -SelfTest
