name: Apply final plain-language launch revisions

on:
  push:
    branches:
      - launch/category-launch-v1
    paths:
      - .github/workflows/apply-plain-language-final.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Rewrite public launch pages for business readers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          business_pages = [
              Path('index.html'),
              Path('financial-services/index.html'),
              Path('healthcare/index.html'),
              Path('aws-marketplace/index.html'),
              Path('get-started.html'),
              Path('pricing/index.html'),
              Path('intake-thank-you/index.html'),
          ]
          aws_status_pages = business_pages + [
              Path('reference-architecture/index.html'),
              Path('news/aws-validated-software-path/index.html'),
          ]

          aws_phrases = [
              ('DigiTrust successfully passed the AWS Foundational Technical Review', 'DigiTrust successfully passed an AWS solution review'),
              ('DigiTrust completed the AWS Foundational Technical Review', 'DigiTrust completed an AWS solution review'),
              ('Foundational Technical Review — approved', 'AWS solution review — passed'),
              ('Foundational Technical Review approved', 'AWS solution review completed'),
              ('Foundational Technical Review', 'AWS solution review'),
              ('DigiTrust FTR approved', 'DigiTrust passed an AWS solution review'),
              ('FTR approved', 'AWS solution review passed'),
              ('AWS Software Path — Validated', 'AWS Partner validation completed'),
              ('Software Path — Validated', 'Partner validation completed'),
          ]
          for page in aws_status_pages:
              text = page.read_text(encoding='utf-8')
              for old, new in aws_phrases:
                  text = text.replace(old, new)
              text = re.sub(r'\bFTR\b', 'AWS solution review', text)
              page.write_text(text, encoding='utf-8')

          phrases = [
              ('$25K–$50K', '$25,000–$50,000'),
              ('$100K+ ACV path', '$100,000+ annual production path'),
              ('$100,000+ ACV', '$100,000+ annual production value'),
              ('No PHI required for initial discovery', 'No protected health information required for initial discovery'),
              ('No PHI required', 'No protected health information required'),
              ('KYC or AML controls', 'identity-verification and anti-money-laundering controls'),
              ('API-driven decisions', 'decisions across connected systems'),
              ('API-driven', 'connected-system'),
              ('agentic workflows', 'AI-agent workflows'),
              ('agentic operations', 'AI-agent operations'),
              ('Agentic workflow or tool use', 'AI-agent workflow or automated tool use'),
              ('Deterministic verification', 'Repeatable, rule-based checks'),
              ('deterministic verification', 'repeatable, rule-based checks'),
              ('Deterministic checks', 'Repeatable, rule-based checks'),
              ('deterministic checks', 'repeatable, rule-based checks'),
              ('Evidence provenance', 'Evidence source history'),
              ('evidence provenance', 'evidence source history'),
              ('Source and workflow provenance', 'Source and workflow history'),
              ('source and workflow provenance', 'source and workflow history'),
              ('Exact-use authorization', 'Approval for a specific use'),
              ('exact-use authorization', 'approval for a specific use'),
              ('exact-use conditions', 'approved-use conditions'),
              ('exact-use boundaries', 'approved-use boundaries'),
              ('fails closed', 'is blocked automatically'),
              ('fail closed', 'block the action automatically'),
              ('technical validation', 'AWS solution review'),
              ('Technical validation', 'AWS solution review'),
              ('co-selling', 'selling with AWS'),
              ('co-sell', 'joint sales'),
              ('go-to-market', 'sales and marketing'),
              ('model-risk', 'model risk'),
              ('data-governance', 'data governance'),
              ('audit-ready reconstruction', 'a complete review history'),
              ('audit reconstruction', 'complete review history'),
              ('reconstructable', 'reviewable later'),
              ('chain of custody', 'record of how the evidence moved'),
              ('Private Offer', 'custom AWS Marketplace offer'),
              ('procurement', 'purchasing'),
              ('Procurement', 'Purchasing'),
          ]
          words = {
              'PHI': 'protected health information',
              'ACV': 'annual contract value',
              'KYC': 'identity verification',
              'AML': 'anti-money-laundering',
              'deterministic': 'rule-based',
              'provenance': 'source history',
              'agentic': 'AI-agent',
          }
          nav_labels = [
              ('>Overview</a>', '>Home</a>'),
              ('>Category</a>', '>Why DigiTrust</a>'),
              ('>Use Cases</a>', '>Common uses</a>'),
              ('>Enterprise Pilot</a>', '>Pilot</a>'),
              ('>Evaluation Paths</a>', '>Other options</a>'),
              ('>AWS Marketplace</a>', '>Buy on AWS</a>'),
              ('>Architecture</a>', '>How it works</a>'),
          ]

          for page in business_pages:
              text = page.read_text(encoding='utf-8')
              for old, new in phrases + nav_labels:
                  text = text.replace(old, new)
              for old, new in words.items():
                  text = re.sub(rf'\b{re.escape(old)}\b', new, text, flags=re.IGNORECASE)
              text = re.sub(r'\bexact-use\b', 'approved-use', text, flags=re.IGNORECASE)
              page.write_text(text, encoding='utf-8')

          targeted = {
              Path('index.html'): [
                  ('Start an enterprise pilot', 'Request a pilot briefing'),
                  ('Provider-neutral trust architecture', 'Works across cloud and AI providers'),
                  ('When AI acts, recommends, or automates, DigiTrust preserves what happened, verifies what supported the result, binds accountable human authority, controls the exact permitted use, records limitations, and makes the full history reviewable later.',
                   'When AI acts, recommends, or automates, DigiTrust records what happened, checks the supporting evidence, captures who approved the result, limits it to the approved purpose, identifies known limits, and keeps a complete review history.'),
                  ('Actor, model, tool, purpose, version, and execution context', 'Who or what acted, why, and in what setting'),
                  ('Source, source history, integrity, lifecycle, and record of how the evidence moved', 'Where the information came from, whether it stayed intact, and how it moved'),
                  ('Repeatable, rule-based checks, support, authority, contradictions, and disclosure', 'Repeatable checks, supporting evidence, conflicts, approval rights, and safe disclosure'),
                  ('Exact reviewer, scope, conditions, decision, and time window', 'Who approved it, for what purpose, under which conditions, and for how long'),
                  ('Evidence, verification, decisions, limitations, and current state', 'Evidence, checks, decisions, known limits, and current status'),
                  ('One inspectable record connects AI execution to evidence, verification, accountable authority, permitted use, and audit history.',
                   'One clear record connects the AI action to its evidence, checks, human approval, approved use, and complete review history.'),
                  ('<span>Attribution</span>', '<span>Who and what acted</span>'),
                  ('<span>Source history</span>', '<span>Where the evidence came from</span>'),
                  ('<span>Assurance</span>', '<span>Checks performed</span>'),
                  ('<span>Authority</span>', '<span>Human approval</span>'),
                  ('<span>Audit</span>', '<span>Review history</span>'),
                  ('<h3>Accountable human control</h3>', '<h3>Accountable human approval</h3>'),
                  ('<h3>Limitations and reconstruction</h3>', '<h3>Known limits and complete review history</h3>'),
                  ('Validated for the AWS partner motion. Available for customer purchase.', 'Reviewed by AWS. Available for customer purchase.'),
                  ('DigiTrans has achieved the Validated stage of the AWS Partner Network Software Path, DigiTrust successfully passed an AWS solution review, and the product is publicly listed in AWS Marketplace.',
                   'DigiTrans completed AWS Partner software validation, DigiTrust passed an AWS solution review, and the product is publicly listed in AWS Marketplace.'),
                  ('Assurance infrastructure—not another AI dashboard.', 'A complete review record—not another AI dashboard.'),
                  ('Hard controls remain hard', 'Required checks cannot be bypassed'),
                  ('Identity, integrity, authority, contradiction, disclosure, and use checks do not become optional because a model is persuasive.',
                   'Identity, evidence integrity, approval rights, conflicts, safe disclosure, and approved-use checks cannot be skipped because an AI answer sounds persuasive.'),
                  ('DigiTrust makes consequential AI workflows attributable, verifiable, human-authorized, limitation-aware, and reviewable later.',
                   'DigiTrust records who or what acted, checks the evidence, captures human approval, states known limits, and preserves a complete review history.'),
              ],
              Path('financial-services/index.html'): [
                  ('Designed for regulated banking, insurance, payments, risk, fraud, customer intelligence, cybersecurity, and AI-agent workflows.',
                   'Designed for regulated banking, insurance, payments, risk, fraud, customer service, cybersecurity, AI agents, and automated workflows.'),
                  ('Connect alerts, evidence, investigation steps, recommended actions, analyst review, approval authority, exceptions, and final disposition.',
                   'Connect alerts, supporting information, investigation steps, recommended actions, analyst review, approval, exceptions, and final outcomes.'),
                  ('Track tools, data access, actions, approval gates, approved-use boundaries, revocation, and the final accountable business outcome.',
                   'Track tools, data access, actions, approval steps, approved-use boundaries, withdrawn approval, and the final accountable business outcome.'),
                  ('Bind alert evidence, triage recommendations, verification results, red-team findings, response authority, and incident reconstruction.',
                   'Connect alert evidence, triage recommendations, check results, security test findings, response approval, and incident review history.'),
                  ('<h3>Accountable human authority</h3>', '<h3>Accountable human approval</h3>'),
                  ('<h3>Limitations and history</h3>', '<h3>Known limits and review history</h3>'),
                  ('AWS-aligned purchasing', 'Buying through AWS Marketplace'),
                  ('AWS workload relevance', 'How AWS is involved'),
              ],
              Path('healthcare/index.html'): [
                  ('<h3>Clinician or accountable human control</h3>', '<h3>Clinician or accountable human approval</h3>'),
                  ('<h3>Limitations and reconstruction</h3>', '<h3>Known limits and review history</h3>'),
                  ('AWS-aligned purchasing', 'Buying through AWS Marketplace'),
              ],
              Path('aws-marketplace/index.html'): [
                  ('Request purchasing guidance', 'Get buying guidance'),
                  ('AWS Marketplace Purchasing', 'Buying through AWS Marketplace'),
                  ('<strong>Co-sell readiness</strong>', '<strong>Ready for AWS sales collaboration</strong>'),
                  ('<div class="section-label">Customer purchasing sequence</div>', '<div class="section-label">How buying works</div>'),
                  ('<strong>Confirm AWS alignment</strong>', '<strong>Confirm how AWS is involved</strong>'),
                  ('<strong>Choose purchase options</strong>', '<strong>Choose how to buy</strong>'),
                  ('Private Offer boundary:', 'Custom Marketplace offer:'),
                  ('Technical validation, Marketplace availability, and a co-sell operating path.', 'AWS review, Marketplace availability, and a sales collaboration path.'),
              ],
              Path('get-started.html'): [
                  ('Review engagements', 'View options'),
                  ('Define the assurance boundary', 'Define what must be proven'),
                  ('Primary assurance concern', 'What do you most need to prove or review?'),
                  ('Verification and quality controls', 'Checks and quality controls'),
                  ('Human review and authority', 'Human review and approval'),
                  ('Security, compliance, or purchasing review', 'Security, compliance, or buying review'),
                  ('AWS workload relevance', 'How is AWS involved?'),
                  ('Purchasing interest', 'Preferred buying path'),
                  ('Standard enterprise purchasing', 'Standard enterprise buying process'),
                  ('Partner-led purchasing', 'Purchase through a consulting or implementation partner'),
                  ('Current controls or blockers', 'Current review process or blockers'),
              ],
          }

          for page, pairs in targeted.items():
              text = page.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              page.write_text(text, encoding='utf-8')

          print('PLAIN_LANGUAGE_CONTENT_REWRITE: COMPLETE')
          PY
      - name: Commit revised public copy
        run: |
          git config user.name 'DigiTrans Research & Engineering'
          git config user.email 'johnagj@outlook.com'
          git add \
            index.html \
            financial-services/index.html \
            healthcare/index.html \
            aws-marketplace/index.html \
            get-started.html \
            pricing/index.html \
            intake-thank-you/index.html \
            reference-architecture/index.html \
            news/aws-validated-software-path/index.html
          git commit -m 'Make category-launch site clear for nontechnical buyers'
          git push origin HEAD:launch/category-launch-v1
